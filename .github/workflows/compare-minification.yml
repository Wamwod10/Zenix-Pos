name: Compare lazy chunk profiles
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/compare-minification.yml'
      - 'vite.config.js'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        profile: [original, related, compact]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=optional
      - name: Measure profile without changing budgets
        shell: bash
        env:
          ZENIX_CHUNK_PROFILE: ${{ matrix.profile }}
        run: |
          npm run build
          node -e 'const fs=require("node:fs"),z=require("node:zlib"),rows=fs.readdirSync("dist/assets").filter(x=>x.endsWith(".js")).map(name=>({name,gzip:z.gzipSync(fs.readFileSync("dist/assets/"+name)).length})); console.log("PROFILE",process.env.ZENIX_CHUNK_PROFILE,"TOTAL_GZIP",rows.reduce((n,x)=>n+x.gzip,0)); console.log(JSON.stringify(rows));'
          node scripts/check-performance-budget.mjs --bundle
