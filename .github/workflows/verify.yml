name: Verify Frontend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=optional
      - name: Verify Linux Rolldown native binding
        run: node -e "import('rolldown').then(() => console.log('Rolldown native binding OK'))"
      - run: npm test
      - run: npm run verify:design
      - run: npm run audit
      - run: npm run verify:production
      - run: npm run build
