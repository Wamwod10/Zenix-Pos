name: Verify Frontend
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    # Playwright Python 1.56 Chromium installer does not support ubuntu26.04.
    # Pin a supported runner without removing browser smoke coverage.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=optional
      - name: Verify Linux Rolldown native binding
        run: node -e "import('rolldown').then(() => console.log('Rolldown native binding OK'))"
      - run: npm test
      - run: npm run verify:design
      - run: npm run audit
      - run: npm run verify:production
      - run: npm run build
      - name: POS Pro HID, checkout, recovery and responsive browser acceptance
        run: |
          # Ubuntu mirror DNS may fail when apt tries to install optional fonts.
          # Hosted ubuntu-24.04 already supplies Chromium runtime libraries;
          # fetch the browser binary without launching apt (tests remain mandatory).
          npx playwright install chromium
          node tests/posPro.browser.mjs
          POS_PRO_UX_ONLY=premium node tests/posPro.browser.mjs
          POS_PRO_UX_ONLY=tracking node tests/posPro.browser.mjs
          POS_PRO_UX_ONLY=polish node tests/posPro.browser.mjs
          POS_PRO_UX_ONLY=scan-clock node tests/posPro.browser.mjs
          POS_PRO_UX_ONLY=pixel node tests/posPro.browser.mjs
          POS_PRO_UX_ONLY=pixel-states node tests/posPro.browser.mjs
          POS_PRO_UX_ONLY=pixel-accessibility node tests/posPro.browser.mjs
          POS_PRO_UX_ONLY=platform-contract node tests/posPro.browser.mjs
          node tests/platformAdminRouting.browser.mjs
      # All captures use the synthetic API harness, never production records.
      - name: Archive POS Pro synthetic visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-pro-synthetic-ui
          path: |
            ../artifacts/phase2/quick-mobile-*.png
            ../artifacts/phase2/touch-mobile-*.png
            ../artifacts/phase2/browser-results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Synthetic CPU and bundle regression budgets
        run: node scripts/check-performance-budget.mjs --bundle

      # Read-only browser check against a local Vite preview; no Neon credentials.
      - name: Install Playwright Chromium for local login smoke
        run: |
          python -m pip install playwright==1.56.0
          # Avoid a second apt dependency pass; keep Python's pinned Chromium smoke.
          python -m playwright install chromium
      - name: Login responsive browser smoke (320/375/430/1440)
        shell: bash
        env:
          ZENIX_STAGING_URL: http://localhost:4173
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/zenix-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/login > /dev/null; then break; fi
            sleep 1
          done
          python tests/browser_smoke.py
