name: Compare frontend minification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/compare-minification.yml'
      - 'vite.config.js'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=optional
      - name: Install pinned comparison-only minifier
        run: npm install --save-dev --save-exact --ignore-scripts terser@5.51.4
      - name: Compare existing and candidate gzip budgets
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node -e 'const fs=require("node:fs"),z=require("node:zlib"); console.log("OXC_TOTAL_GZIP",fs.readdirSync("dist/assets").filter(x=>x.endsWith(".js")).reduce((n,x)=>n+z.gzipSync(fs.readFileSync("dist/assets/"+x)).length,0))'
          ZENIX_COMPARE_TERSER=1 npm run build
          node -e 'const fs=require("node:fs"),z=require("node:zlib"); console.log("TERSER_TOTAL_GZIP",fs.readdirSync("dist/assets").filter(x=>x.endsWith(".js")).reduce((n,x)=>n+z.gzipSync(fs.readFileSync("dist/assets/"+x)).length,0))'
          node scripts/check-performance-budget.mjs --bundle
      - name: Record candidate dependency lockfile
        if: always()
        run: git diff -- package.json package-lock.json
